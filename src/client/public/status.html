<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vibecheck · status</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="status">
        <h1>status</h1>
        <div class="counters">
            <p class="counter" id="sessions">vibecheck attivi: —</p>
            <p class="counter" id="participants">partecipanti: —</p>
        </div>
    </main>
    <script>
        async function refreshStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                document.getElementById('sessions').textContent = 'sessioni attive: ' + data.sessions;
                document.getElementById('participants').textContent = 'partecipanti: ' + data.participants;
            } catch {}
        }

        refreshStatus();
        setInterval(refreshStatus, 1000);
    </script>
</body>
</html>
